worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 8m;
    client_body_timeout  30s;
    client_header_timeout 30s;
    send_timeout         30s;

    gzip               on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types         application/json application/javascript text/css text/plain text/xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=docs:10m rate=2r/s;

    upstream oxyroute_app {
        server oxyroute-app:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Health check passthrough (matches /api/root/health in this template).
        location = /healthz {
            proxy_pass         http://oxyroute_app/api/root/health;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        location /api/docs {
            limit_req          zone=docs burst=5 nodelay;
            proxy_pass         http://oxyroute_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
        }

        # WebSocket pass-through (OxyRoute supports native WebSockets).
        location /ws {
            proxy_pass         http://oxyroute_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            limit_req          zone=api burst=40 nodelay;
            proxy_pass         http://oxyroute_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
            proxy_buffering    on;
        }
    }
}
