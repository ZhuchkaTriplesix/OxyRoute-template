[project]
name = "oxyroute-template"
version = "0.1.0"
description = "Production-ready OxyRoute (RSGI) boilerplate with PostgreSQL, Redis, Alembic, Docker, and CI/CD"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "integration: tests that require live PostgreSQL / Redis",
]
